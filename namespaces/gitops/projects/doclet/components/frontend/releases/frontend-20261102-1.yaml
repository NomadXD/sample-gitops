apiVersion: openchoreo.dev/v1alpha1
kind: ComponentRelease
metadata:
  name: frontend-20261102-1
  namespace: gitops
spec:
  componentProfile:
    parameters:
      port: 80
      replicas: 1
  componentType:
    kind: ComponentType
    name: deployment/web-application
    spec:
      allowedEndpoints:
      - default: true
        name: http
        protocols:
        - HTTP
        - GraphQL
        - Websocket
        ref:
          kind: EndpointType
          name: http
      allowedTraits:
      - kind: Trait
        name: api-configuration
      - kind: Trait
        name: observability-alert-rule
      allowedWorkflows:
      - kind: Workflow
        name: docker-gitops-release
      environmentConfigs:
        openAPIV3Schema:
          $defs:
            ResourceQuantity:
              properties:
                cpu:
                  default: 100m
                  type: string
                memory:
                  default: 256Mi
                  type: string
              type: object
            ResourceRequirements:
              properties:
                limits:
                  $ref: '#/$defs/ResourceQuantity'
                  default: {}
                requests:
                  $ref: '#/$defs/ResourceQuantity'
                  default: {}
              type: object
          properties:
            imagePullPolicy:
              default: IfNotPresent
              type: string
            replicas:
              default: 1
              type: integer
            resources:
              $ref: '#/$defs/ResourceRequirements'
              default: {}
          type: object
      resources:
      - id: deployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.name}
            namespace: ${metadata.namespace}
          spec:
            replicas: ${environmentConfigs.replicas}
            selector:
              matchLabels: ${metadata.podSelectors}
            template:
              metadata:
                labels: ${metadata.podSelectors}
              spec:
                containers:
                - args: |
                    ${has(workload.container.args) ? workload.container.args : oc_omit()}
                  command: |
                    ${has(workload.container.command) ? workload.container.command : oc_omit()}
                  env: ${dependencies.toContainerEnvs()}
                  envFrom: ${configurations.toContainerEnvFrom()}
                  image: ${workload.container.image}
                  imagePullPolicy: ${environmentConfigs.imagePullPolicy}
                  name: main
                  resources:
                    limits:
                      cpu: ${environmentConfigs.resources.limits.cpu}
                      memory: ${environmentConfigs.resources.limits.memory}
                    requests:
                      cpu: ${environmentConfigs.resources.requests.cpu}
                      memory: ${environmentConfigs.resources.requests.memory}
                  volumeMounts: ${configurations.toContainerVolumeMounts()}
                volumes: ${configurations.toVolumes()}
      - id: service
        includeWhen: ${size(workload.endpoints) > 0}
        template:
          apiVersion: v1
          kind: Service
          metadata:
            labels: ${metadata.labels}
            name: ${metadata.componentName}
            namespace: ${metadata.namespace}
          spec:
            ports: ${workload.toServicePorts()}
            selector: ${metadata.podSelectors}
            type: ClusterIP
      - forEach: ${configurations.toConfigEnvsByContainer()}
        id: env-config
        template:
          apiVersion: v1
          data: |
            ${envConfig.envs.transformMapEntry(index, env, {env.name: env.value})}
          kind: ConfigMap
          metadata:
            name: ${envConfig.resourceName}
            namespace: ${metadata.namespace}
        var: envConfig
      - forEach: ${configurations.toConfigFileList()}
        id: file-config
        template:
          apiVersion: v1
          data:
            ${config.name}: |
              ${config.value}
          kind: ConfigMap
          metadata:
            name: ${config.resourceName}
            namespace: ${metadata.namespace}
        var: config
      - forEach: ${configurations.toSecretEnvsByContainer()}
        id: secret-env-external
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${secretEnv.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data: |
              ${secretEnv.envs.map(secret, {
                "secretKey": secret.name,
                "remoteRef": {
                  "key": secret.remoteRef.key,
                  ?"property": secret.remoteRef.?property
                }
              })}
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${secretEnv.resourceName}
        var: secretEnv
      - forEach: ${configurations.toSecretFileList()}
        id: secret-file-external
        template:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: ${file.resourceName}
            namespace: ${metadata.namespace}
          spec:
            data:
            - remoteRef:
                key: ${file.remoteRef.key}
                property: |
                  ${has(file.remoteRef.property) ? file.remoteRef.property : oc_omit()}
              secretKey: ${file.name}
            refreshInterval: 15s
            secretStoreRef:
              kind: ClusterSecretStore
              name: ${dataplane.secretStore}
            target:
              creationPolicy: Owner
              name: ${file.resourceName}
        var: file
      validations:
      - message: Web-application components must have at least one HTTP.
        rule: ${workload.endpoints.exists(name, endpoint, endpoint.protocol == 'HTTP')}
      workloadType: deployment
  owner:
    componentName: frontend
    projectName: doclet
  workload:
    container:
      image: cr.openchoreo.dev/openchoreo/samples/doclet-frontend:latest
    dependencies:
      endpoints:
      - component: document-svc
        envBindings:
          address: DOC_SERVICE_URL
        name: http
        visibility: project
      - component: collab-svc
        envBindings:
          address: COLLAB_SERVICE_URL
        name: http
        visibility: project
    endpoints:
      http:
        port: 80
        protocol: HTTP
