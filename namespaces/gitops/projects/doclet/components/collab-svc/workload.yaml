apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
  name: collab-svc-workload
  namespace: gitops
spec:
  container:
    env:
    - key: DOCLET_COLLAB_ADDR
      value: :8090
    image: cr.openchoreo.dev/openchoreo/samples/doclet-collab:latest
  endpoints:
    http:
      protocol: HTTP
      port: 8090
  dependencies:
    resources:
      - ref: doclet-nats
        envBindings:
          url: DOCLET_NATS_URL
  owner:
    componentName: collab-svc
    projectName: doclet
